general {
  after_sleep_cmd=wlopm --on '*'
  before_sleep_cmd=loginctl lock-session
  ignore_dbus_inhibit=false
  lock_cmd=mshell lock lock
}

listener {
  on-timeout=mshell lock lock
  timeout=300
}

listener {
  on-resume=wlopm --on '*'
  on-timeout=wlopm --off '*'
  timeout=360
}

listener {
  on-timeout=systemctl suspend
  timeout=480
}
